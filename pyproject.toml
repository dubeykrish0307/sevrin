[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", "whisper.cpp", "ui/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B904", "B905"]

[tool.ruff.lint.per-file-ignores]
# scripts that put the project root on sys.path before importing from it
"backend/service.py" = ["E402"]
"tools/*.py" = ["E402"]
"voice/voice_id/enroll.py" = ["E402"]
"voice/voice_id/record.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["config", "backend", "brain", "voice"]

